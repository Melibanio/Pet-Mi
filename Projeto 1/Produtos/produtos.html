<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Produtos - Pet&Mi</title>



    <!-- CSS -->

    <link rel="stylesheet" href="style.css">

</head>

<body>



    <!-- CABEÇALHO -->

    <header>

        <!-- Melissa adiciona depois -->

    </header>



    <!-- CONTEÚDO PRINCIPAL -->

    <main class="container">



        <!-- MENU LATERAL -->

        <aside class="categorias">



            <h2>Categorias</h2>



            <ul>

                <li class="ativo">Cachorros</li>

                <li>Gatos</li>

                <li>Coelhos</li>

                <li>Aves</li>

                <li>Peixes</li>

                <li>Roedores</li>

            </ul>



        </aside>



        <!-- ÁREA PRODUTOS -->

        <section class="produtos">



            <h1>Produtos para Cachorros</h1>



            <!-- SUBCATEGORIAS -->

            <div class="subcategorias">

                <button>Ração</button>

                <button>Higiene</button>

                <button>Brinquedos</button>

                <button>Coleiras</button>

                <button>Roupinhas</button>

                <button>Medicamentos</button>

            </div>



            <!-- LISTA DE PRODUTOS -->

            <div class="lista-produtos">



                <!-- PRODUTO 1 -->

                <div class="card">

                    <img src="/img/produto1.png" alt="Produto">



                    <h3>Ração Dog Gold Premium</h3>



                    <p>Alimento completo para cães adultos.</p>



                    <div class="info">

                        <span>R$ 129,90</span>

                        <button>🛒</button>

                    </div>

                </div>



                <!-- PRODUTO 2 -->

                <div class="card">

                    <img src="/img/produto2.png" alt="Produto">



                    <h3>Shampoo Sanol Dog</h3>



                    <p>Limpa e hidrata os pelos.</p>



                    <div class="info">

                        <span>R$ 29,90</span>

                        <button>🛒</button>

                    </div>

                </div>



                <!-- PRODUTO 3 -->

                <div class="card">

                    <img src="/img/produto3.png" alt="Produto">



                    <h3>Mordedor Osso Pet</h3>



                    <p>Brinquedo resistente para cães.</p>



                    <div class="info">

                        <span>R$ 24,90</span>

                        <button>🛒</button>

                    </div>

                </div>



            </div>



        </section>



    </main>



    <!-- RODAPÉ -->

    <footer>

        <!-- Melissa adiciona depois -->

    </footer>



    <!-- JAVASCRIPT -->

    <script src="script.js"></script>



</body>

</html>
