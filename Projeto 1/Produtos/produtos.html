<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- =============================================
         TÍTULO DA ABA DO NAVEGADOR
         Altere o texto entre as tags <title>
    ============================================= -->
    <title>Produtos - Pet&Mi</title>

    <!-- =============================================
         FONTE DO SITE — importada do Google Fonts
         Para trocar a fonte, substitua "Nunito" por outra
         Exemplo: Roboto, Poppins, Montserrat
         Site para escolher fontes: fonts.google.com
    ============================================= -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- =============================================
         ARQUIVO DE ESTILOS (CSS)
         Não altere este caminho
    ============================================= -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =============================================
         CABEÇALHO DO SITE (TOPO)
         Contém o logo e o botão do carrinho
         Para mudar o nome do site, edite o texto
         dentro da div class="logo"
    ============================================= -->
    <header>
        <div class="header-inner">

            <!-- LOGO / NOME DO SITE -->
            <div class="logo">🐾 Pet<span>&Mi</span></div>

            <!-- BOTÃO DO CARRINHO
                 Sem função por enquanto — outro desenvolvedor
                 irá implementar a lógica deste botão -->
            <div class="header-carrinho">
                <button class="btn-carrinho-header">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1" />
                        <circle cx="20" cy="21" r="1" />
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
                    </svg>
                    Carrinho
                    <!-- NÚMERO DE ITENS NO CARRINHO — atualizado pelo JavaScript -->
                    <span class="badge-count" id="badge-count">0</span>
                </button>
            </div>

        </div>
    </header>


    <!-- =============================================
         CONTEÚDO PRINCIPAL DA PÁGINA
         Contém o menu lateral e a área de produtos
    ============================================= -->
    <main class="container">


        <!-- =============================================
             MENU LATERAL DE CATEGORIAS
             Para adicionar uma nova categoria:
             1. Copie um bloco <li> abaixo
             2. Troque o data-cat para o nome da categoria
             3. Troque o texto visível
             4. Adicione a categoria também no arquivo script.js
        ============================================= -->
        <aside class="categorias">
            <h2>Categorias</h2>
            <ul>

                <!-- CATEGORIA: CACHORROS -->
                <li class="ativo" data-cat="Cachorros">
                    <span class="cat-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 64 64"
                            fill="currentColor">
                            <path
                                d="M50 14c-1.1 0-2 .9-2 2v4h-4v-4c0-1.1-.9-2-2-2s-2 .9-2 2v4h-2c-2.2 0-4 1.8-4 4v2H22c-6.6 0-12 5.4-12 12v6c0 3.3 1.3 6.3 3.5 8.5L15 54c.4.4.9.6 1.4.6s1-.2 1.4-.6l1.5-1.5c1.3.6 2.7.9 4.2.9h17c1.4 0 2.8-.3 4.1-.9l1.5 1.5c.4.4.9.6 1.4.6s1-.2 1.4-.6l1.5-1.5c2.2-2.2 3.5-5.2 3.5-8.5v-6c0-3.8-1.8-7.2-4.6-9.4C50.6 28.3 52 26.3 52 24v-8c0-1.1-.9-2-2-2zM23.5 44c-1.4 0-2.5-1.1-2.5-2.5S22.1 39 23.5 39s2.5 1.1 2.5 2.5S24.9 44 23.5 44zm17 0c-1.4 0-2.5-1.1-2.5-2.5S39.1 39 40.5 39s2.5 1.1 2.5 2.5S41.9 44 40.5 44z" />
                        </svg>
                    </span>
                    Cachorros
                </li>

                <!-- CATEGORIA: GATOS -->
                <li data-cat="Gatos">
                    <span class="cat-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 64 64"
                            fill="currentColor">
                            <path
                                d="M48 8l-6 8h-4l-6-8-6 8H14v14c0 10 7 18 16 20v4h4v-4c9-2 16-10 16-20V16h-8l-6-8zm-8 24a2 2 0 110-4 2 2 0 010 4zm-16 0a2 2 0 110-4 2 2 0 010 4z" />
                        </svg>
                    </span>
                    Gatos
                </li>

                <!-- CATEGORIA: COELHOS -->
                <li data-cat="Coelhos">
                    <span class="cat-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 64 64"
                            fill="currentColor">
                            <path
                                d="M38 8c0 0-2-6-8-6s-8 6-8 6c-4 2-6 8-6 14 0 8 4 14 10 16v6h8v-6c6-2 10-8 10-16 0-6-2-12-6-14zm-6 24a10 10 0 110-20 10 10 0 010 20zm-4-12a2 2 0 110-4 2 2 0 010 4zm8 0a2 2 0 110-4 2 2 0 010 4z" />
                        </svg>
                    </span>
                    Coelhos
                </li>

                <!-- CATEGORIA: AVES -->
                <li data-cat="Aves">
                    <span class="cat-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 64 64"
                            fill="currentColor">
                            <path
                                d="M52 12c-6 0-12 4-16 10-2-1-4-2-6-2-8 0-14 6-14 14s6 14 14 14c4 0 8-2 10-4l2 10h4l-2-12c4-4 8-10 8-16V12zm-22 30c-6 0-10-4-10-10s4-10 10-10c2 0 4 .6 5.6 1.6C34 26 32 30 32 34c0 2 .4 4 1 6-1 1.2-1.8 2-3 2z" />
                        </svg>
                    </span>
                    Aves
                </li>

                <!-- CATEGORIA: PEIXES -->
                <li data-cat="Peixes">
                    <span class="cat-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 64 64"
                            fill="currentColor">
                            <path
                                d="M56 32c0 0-8-16-24-16-4 0-8 1-12 3L8 12v12l8 8-8 8v12l12-7c4 2 8 3 12 3 16 0 24-16 24-16zm-24 8a8 8 0 110-16 8 8 0 010 16zm2-10a2 2 0 110-4 2 2 0 010 4z" />
                        </svg>
                    </span>
                    Peixes
                </li>

                <!-- CATEGORIA: ROEDORES -->
                <li data-cat="Roedores">
                    <span class="cat-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 64 64"
                            fill="currentColor">
                            <path
                                d="M44 16c-4 0-8 2-10 6-2-1-4-2-6-2-8 0-14 6-14 14 0 6 4 12 10 14l-2 6h4l2-5c2 1 4 1 6 1s4 0 6-1l2 5h4l-2-6c6-2 10-8 10-14 0-10-4-18-10-18zm-16 26a2 2 0 110-4 2 2 0 010 4zm12 0a2 2 0 110-4 2 2 0 010 4z" />
                        </svg>
                    </span>
                    Roedores
                </li>

            </ul>
        </aside>


        <!-- =============================================
             ÁREA PRINCIPAL DE PRODUTOS
             O título, subcategorias e cards são
             gerados automaticamente pelo JavaScript
             com base na categoria selecionada
        ============================================= -->
        <section class="produtos">

            <!-- TÍTULO DA CATEGORIA SELECIONADA
                 Atualizado automaticamente pelo JavaScript -->
            <h1 class="titulo-categoria">Tudo para seu Cachorro</h1>

            <!-- BOTÕES DE SUBCATEGORIA
                 Gerados automaticamente pelo JavaScript
                 Não adicione nada aqui manualmente -->
            <div class="subcategorias"></div>

            <!-- CARDS DE PRODUTOS
                 Gerados automaticamente pelo JavaScript
                 Não adicione nada aqui manualmente -->
            <div class="lista-produtos"></div>

        </section>


    </main>


    <!-- =============================================
         RODAPÉ DO SITE
         Altere os textos conforme necessário
    ============================================= -->
    <footer>
        <div class="footer-inner">
            <!-- TEXTO ESQUERDO DO RODAPÉ -->
            <span>🐾 Pet&Mi — Tudo para o seu pet com amor</span>
            <!-- TEXTO DIREITO DO RODAPÉ -->
            <span>© 2025 Todos os direitos reservados</span>
        </div>
    </footer>


    <!-- =============================================
         ARQUIVO JAVASCRIPT
         Deve ficar sempre no final do body
         Não mova esta linha
    ============================================= -->
    <script src="script.js"></script>

</body>

</html>
