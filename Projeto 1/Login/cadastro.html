<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="login-cadastro.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.9.1/fonts/remixicon.min.css">

</head>

<body>
    <header>
        <!--Menu simples login/cadastro para voltar ao home-->
        <a href="/Home/menu.html" class="logo">PET&MI</a>
    </header>

    <main class="cadastro-container">
        <form action="cadastro" method="POST">
            <h2>CRIE SUA CONTA</h2>
            <hr>

            <section>
                <label for="nome">Nome completo</label>
                <input type="text" name="nome" id="nome" placeholder="Digite seu nome completo" required>

                <label for="email">E-mail</label>
                <input type="text" name="email" id="email" placeholder="Digite seu e-mail" required>

                <div class="crieSenha">

                    <div class="campo">
                        <label for="senha">Crie sua senha</label>
                        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
                    </div>

                    <div class="campo">
                        <label for="confirmarSenha">Confirme sua senha</label>
                        <input type="password" id="confirmarSenha" name="confirmarSenha"
                            placeholder="Confirme sua senha" required>
                    </div>

                </div>
                
                <button type="submit" class="cadastrar">Cadastrar</button>
            </section>
        </form>

        <div class="imagem">
            <img src="https://i.pinimg.com/736x/0a/6d/24/0a6d243df708e0aced5a61b3d37c5c90.jpg" alt="">
        </div>
    </main>

    <script src="cadastro.js"></script>
</body>
</html>
