<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="cadastro.html">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.9.1/fonts/remixicon.min.css">

</head>

<body>
    <header>
        <!--Menu simples login/cadastro para voltar ao home-->
        <a href="/Home/menu.html" class="logo">PET&MI</a>
    </header>

    <main class="login-container">
        <div class="name">PET&MI</div>
        <form action="/login" method="POST">
            <h2>LOGIN CONTA</h2>
            <hr>

            <div class="campo">
                <label for="user">Digite seu e-mail</label>
                <input type="text" id="user" name="user" required>
            </div>
            <div class="campo">
                <label for="senha">Digite sua senha</label>
                <input type="password" id="senha" name="senha" required>
            </div>

            <div class="senha">
                <a href="/recuperar-senha">Esqueci minha senha</a>
            </div>

            <button type="submit">ENTRAR</button>
            <p>Ainda não tem conta?<a href="/cadastro.html">Cadastre-se aqui</a></p>

        </form>
    </main>

</body>

</html>
