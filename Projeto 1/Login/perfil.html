<!DOCTYPE html>

<body>

    <header>
        <a href="/Home/menu.html" class="logo">PET&MI</a>

    <main>

        <section class="perfil-container">

            <div class="campo">

            <div class="campo">
                <input type="email" value="adm@gmail.com" disabled class="email">

            <div class="campo">
                <input type="text" value="(11) 99999-9999" disabled>
            </div>

            <h2>Nascimento</h2>
            <div class="campo">

            </div>
