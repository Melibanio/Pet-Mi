<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha</title>
    <link rel="stylesheet" href="esqueciSenha.css">
</head>

<body>

    <header>
        <!-- Menu simples -->
        <a href="/Home/menu.html" class="logo">PET&MI</a>
    </header>

    <main class="esqueciSenha-container">

        <h1>Esqueci minha senha</h1>

        <form action="Recuperar">

            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Digite seu e-mail" required>
            <div class="senhas">

                <div>
                    <label for="senha">Nova senha</label>
                    <input type="password" id="senha" placeholder="Digite a nova senha" required>
                </div>

                <div>
                    <label for="confirmar">Confirmar senha</label>
                    <input type="password" id="confirmar" placeholder="Confirme a senha" required>
                </div>

            </div>

            <button type="submit">
                Salvar
            </button>

        </form>

    </main>

    <script src="esqueciSenha.js"></script>

</body>

</html>
